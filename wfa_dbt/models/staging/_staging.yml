version: 2

models:
  - name: stg_forecast
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - requested_latitude
              - requested_longitude
              - report_date_time
              - forecast_date_time
    columns:
      - name: report_date_time
        data_tests:
          - not_null
      - name: forecast_date_time
        data_tests:
          - not_null
      - name: city
        data_tests:
          - not_null
  - name: stg_actual
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - requested_latitude
              - requested_longitude
              - observed_date_time
    columns:
      - name: observed_date_time
        data_tests:
          - not_null
      - name: loaded_date_time
        data_tests:
          - not_null
      - name: city
        data_tests:
          - not_null

