version: 2

models:
  - name: fct_forecast_error
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - requested_latitude
              - requested_longitude
              - report_date_time
              - forecast_date_time 
    columns:
      - name: report_date_time
        data_tests:
          - not_null
      - name: forecast_date_time
        data_tests:
          - not_null
      - name: requested_latitude
        data_tests:
          - not_null
      - name: requested_longitude
        data_tests:
          - not_null
      - name: lead_time_hours
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 167
      - name: temperature_actual
        data_tests:
          - not_null
      - name: precipitation_actual
        data_tests:
          - not_null
  - name: agg_forecast_error_by_lead_day
    columns:
      - name: lead_day
        data_tests:
            - unique
            - not_null
